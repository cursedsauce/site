<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Solwoker official page" />
  <title>Solwoker Website</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@800;900&display=swap");

    :root {
      --bg: #000;
      --fg: #fff;
      --line: rgba(255,255,255,.28);
      --muted: rgba(255,255,255,.58);
      --pad: clamp(1rem, 2vw, 2rem);
      --mono: "IBM Plex Mono", monospace;
      --sans: "Inter", Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      font-family: var(--sans);
      cursor: default;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: .14;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.10) 0,
          rgba(255,255,255,.10) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 101;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          transparent 0 18%,
          rgba(255,255,255,.14) 18% 18.35%,
          transparent 18.35% 63%,
          rgba(255,255,255,.09) 63% 63.5%,
          transparent 63.5%
        );
      opacity: 0;
      animation: signal-cut 2.8s steps(1, end) infinite;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .header,
    .footer {
      position: fixed;
      left: 0;
      width: 100%;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding-inline: var(--pad);
      font-family: var(--mono);
      font-size: .67rem;
      letter-spacing: .05em;
      text-transform: uppercase;
      background: #000;
    }

    .header {
      top: 0;
      height: 4.4rem;
      border-bottom: 1px solid var(--line);
    }

    .footer {
      bottom: 0;
      height: 3.8rem;
      border-top: 1px solid var(--line);
    }

    .logo {
      justify-self: start;
      font-family: var(--mono);
      font-weight: 400;
      letter-spacing: .05em;
      font-size: .67rem;
      text-transform: uppercase;
    }

    .header-center,
    .footer-center {
      color: var(--muted);
    }

    .header-right,
    .footer-right {
      justify-self: end;
    }

    main {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding:
        calc(4.4rem + var(--pad))
        var(--pad)
        calc(3.8rem + var(--pad));
    }

    .title-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    h1 {
      position: relative;
      margin: 0;
      text-align: center;
      font-size: clamp(3.2rem, 11vw, 10rem);
      line-height: .92;
      letter-spacing: .08em;
      font-weight: 900;
      text-transform: uppercase;
      animation: hard-jump 3.4s steps(1, end) infinite;
      will-change: transform, clip-path;
    }

    h1 span {
      display: block;
    }

    h1::before,
    h1::after {
      content: "СКОРО";
      white-space: pre;
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      pointer-events: none;
      opacity: 0;
    }

    h1::before {
      clip-path: inset(8% 0 58% 0);
      animation: slice-a 2.3s steps(1, end) infinite;
    }

    h1::after {
      clip-path: inset(61% 0 13% 0);
      animation: slice-b 3.1s steps(1, end) infinite;
    }

    .tear {
      position: absolute;
      left: -5%;
      width: 110%;
      height: 12px;
      top: 46%;
      background: rgba(255,255,255,.92);
      mix-blend-mode: difference;
      opacity: 0;
      pointer-events: none;
      animation: hard-tear 1.9s steps(1, end) infinite;
    }

    .tear::before,
    .tear::after {
      content: "";
      position: absolute;
      left: 0;
      width: 100%;
      background: rgba(255,255,255,.38);
    }

    .tear::before {
      height: 3px;
      top: -9px;
    }

    .tear::after {
      height: 2px;
      top: 17px;
    }

    @keyframes hard-jump {
      0%, 72%, 76%, 100% {
        transform: translate(0, 0);
        clip-path: inset(0);
      }

      73% {
        transform: translate(-14px, 0);
        clip-path: inset(0 0 66% 0);
      }

      74% {
        transform: translate(18px, 0);
        clip-path: inset(36% 0 22% 0);
      }

      75% {
        transform: translate(-6px, 0);
        clip-path: inset(69% 0 0 0);
      }

      89% {
        transform: translate(0, 0);
      }

      90% {
        transform: translate(7px, -1px);
      }

      91% {
        transform: translate(-11px, 1px);
      }

      92% {
        transform: translate(0, 0);
      }
    }

    @keyframes slice-a {
      0%, 83%, 87%, 100% {
        opacity: 0;
        transform: translateX(0);
      }

      84% {
        opacity: .65;
        transform: translateX(-24px);
      }

      85% {
        opacity: .32;
        transform: translateX(16px);
      }

      86% {
        opacity: .7;
        transform: translateX(-9px);
      }
    }

    @keyframes slice-b {
      0%, 63%, 67%, 100% {
        opacity: 0;
        transform: translateX(0);
      }

      64% {
        opacity: .48;
        transform: translateX(20px);
      }

      65% {
        opacity: .22;
        transform: translateX(-31px);
      }

      66% {
        opacity: .62;
        transform: translateX(11px);
      }
    }

    @keyframes hard-tear {
      0%, 68%, 72%, 100% {
        opacity: 0;
        transform: translateX(0);
      }

      69% {
        opacity: .95;
        transform: translateX(-9%);
      }

      70% {
        opacity: .45;
        transform: translateX(13%);
      }

      71% {
        opacity: .85;
        transform: translateX(-4%);
      }
    }

    @keyframes signal-cut {
      0%, 92%, 95%, 100% {
        opacity: 0;
        transform: translateX(0);
      }

      93% {
        opacity: .8;
        transform: translateX(-18px);
      }

      94% {
        opacity: .35;
        transform: translateX(23px);
      }
    }

    @media (max-width: 700px) {
      .header,
      .footer {
        grid-template-columns: 1fr auto;
      }

      .header-center,
      .footer-center {
        display: none;
      }

      h1 {
        font-size: clamp(3rem, 15vw, 6rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::after,
      h1,
      h1::before,
      h1::after,
      .tear {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <a class="logo" href="#" aria-label="Solwoker home">Solwoker</a>
    <span class="header-right">192.168.1.1</span>
  </header>

  <main>
    <div class="title-wrap">
      <h1>
        <span>СКОРО</span>
      </h1>
      <div class="tear" aria-hidden="true"></div>
    </div>
  </main>

  <footer class="footer">
    <span>© 2026 Solwoker</span>
    <span class="footer-right"></span>
  </footer>
</body>
</html>
